services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: inno2026:latest

    container_name: inno2026

    ports:
      - "8081:8080"

    env_file:
      - .env.docker

    volumes:
      - inno2026_storage:/app/storage/app/public

    restart: unless-stopped

volumes:
  inno2026_storage: